name: Build APK
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Build APKs or inspect the live TG player contract
        type: choice
        options: [build, inspect]
        default: build
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect live player metadata without saving credentials
        run: python3 .github/scripts/inspect-tg-player.py
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'inspect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - name: Test stream resolution and build both APKs
        run: |
          set -o pipefail
          gradle testArm32DebugUnitTest testArm64DebugUnitTest assembleArm32Release assembleArm64Release --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/aktv-gradle.log"
      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/report-build-errors.py
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/arm32/release/*.apk out/AK-TV-arm32.apk
          cp app/build/outputs/apk/arm64/release/*.apk out/AK-TV-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AK-TV-apks
          path: out/*.apk
