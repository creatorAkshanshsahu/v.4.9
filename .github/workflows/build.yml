name: Build APK
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - name: Test stream resolution and build both APKs
        run: |
          set -o pipefail
          gradle testArm32DebugUnitTest testArm64DebugUnitTest assembleArm32Release assembleArm64Release --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/aktv-gradle.log"
      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/report-build-errors.py
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/arm32/release/*.apk out/AK-TV-arm32.apk
          cp app/build/outputs/apk/arm64/release/*.apk out/AK-TV-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AK-TV-apks
          path: out/*.apk
