name: Sony shelf check
# Read-only: reports which Sony shelf IDs the live channel feed advertises.
on:
  workflow_dispatch:
  push:
    branches: [ 'arena/**' ]
    paths: [ 'app/src/main/java/com/aktv/app/LiveCollections.kt' ]
permissions:
  contents: read
jobs:
  shelf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.9 }
      - name: Check the Sony shelf against the live feed
        continue-on-error: true
        run: |
          gradle testArm64DebugUnitTest --tests 'com.aktv.app.TgLiveContractTest' \
            -PliveTg=true --console=plain 2>&1 | tail -40
      - name: Report the redacted result
        if: always()
        run: python3 .github/scripts/report-live-player.py
