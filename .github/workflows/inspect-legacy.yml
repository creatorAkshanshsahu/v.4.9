name: Inspect historical APK
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-legacy.yml'
      - '.github/scripts/inspect-legacy-apk.py'
      - '.github/scripts/inspect-legacy-apk.test.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test inspection guards and redaction
        run: python3 .github/scripts/inspect-legacy-apk.test.py
      - name: Install static APK parser
        run: python3 -m pip install --quiet --disable-pip-version-check androguard==4.1.3
      - name: Inspect the public 4.7.3 APK without running it
        timeout-minutes: 5
        run: python3 .github/scripts/inspect-legacy-apk.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-apk-redacted-report
          path: ${{ runner.temp }}/legacy-apk-inspection/redacted-report.json
          if-no-files-found: warn
