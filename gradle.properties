org.gradle.jvmargs=-Xmx3072m
android.useAndroidX=true
# Sideload signing key for every release build, so the in-app update installs over the current app.
# Override with -PaktvUpdateStorePassword=… or AKTV_UPDATE_STORE_PASSWORD. The key file is committed
# because this app is distributed as an APK, not through a store.
aktvUpdateStorePassword=aktv-update-key
